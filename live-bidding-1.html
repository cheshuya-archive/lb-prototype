<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live bidding · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--fg:#171717;--muted:#737373;--muted-bg:#f5f5f5;--border:#e5e5e5;--primary:#0369a1;--primary-hover:#075985;
  --ok:#16a34a;--err:#dc2626;--warn:#d97706;--gold:#b45309;--gold-bg:#fffbeb;--gold-border:#f2c46d;
  --ease:cubic-bezier(.22,.8,.24,1);--ease-in:cubic-bezier(.5,0,.75,0);
}
*{box-sizing:border-box}
html,body{margin:0;background:#eceff3;color:var(--fg);font-family:Roboto,system-ui,sans-serif;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.stage-wrap{display:flex;justify-content:center;padding:24px 24px 120px}
.screen{position:relative;width:1440px;height:1024px;flex-shrink:0;overflow:hidden;background:var(--bg);border-radius:14px;box-shadow:0 20px 60px rgba(15,23,42,.18);transform-origin:top center}

/* ---- левая колонка лотов ---- */
.side{position:absolute;left:0;top:0;width:264px;height:100%;padding:16px 10px 0;border-right:1px solid var(--border)}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 12px}
.follow{display:flex;align-items:center;gap:10px;font-size:14px}
.check{width:18px;height:18px;border-radius:5px;background:var(--primary);display:grid;place-items:center}
.btn-xs{height:26px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px;font-weight:500}
.side-list{position:absolute;top:58px;left:10px;right:10px;bottom:0;overflow:hidden}
.side-track{display:flex;flex-direction:column;gap:10px;transition:transform .7s var(--ease)}
.lcard{height:162px;padding:8px 6px 6px;border:1.5px solid var(--border);border-radius:6px;background:#fff;transition:background .5s var(--ease),border-color .5s var(--ease),opacity .5s}
.lcard .row{display:flex;justify-content:space-between;align-items:baseline;padding:0 0 4px;font-size:16px;font-weight:500}
.lcard .row b{font-weight:500}
.lcard img{width:100%;height:110px;object-fit:contain;background:#fff;border-radius:4px}
.lcard small{display:block;margin-top:4px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard.is-current{background:var(--gold-bg);border-color:var(--gold-border)}
.lcard.is-current .row,.lcard.is-current small{color:var(--gold)}
.lcard.is-sold{background:#f3f4f6;opacity:.75}
.lcard .price{transition:color .4s}
.lcard.is-won .price{color:var(--ok)}.lcard.is-lost .price{color:var(--err)}

/* ---- шапка ---- */
.head{position:absolute;left:280px;top:24px;right:10px;height:48px;display:flex;align-items:center;gap:14px}
.logo{width:131px;height:45px;background:#d9a68c;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#111}
.logo b{font-size:30px;letter-spacing:4px;font-weight:700}.logo span{font-size:7px;letter-spacing:5px;margin-top:2px}
.title{font-size:16px;letter-spacing:.2px}
.head .spacer{flex:1}
.catalog{color:var(--primary);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;margin-right:60px}
.cur{display:flex;align-items:center;gap:6px;font-weight:500}
.flag{width:24px;height:16px;border-radius:2px;background:linear-gradient(#0b3d91 0 0) ,#c8102e;position:relative;overflow:hidden}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:grid;place-items:center}

/* ---- фото ---- */
.photo{position:absolute;left:280px;top:85px;width:891px;height:443px;overflow:hidden;border-radius:6px;background:#fff}
.photo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;transition:opacity .5s var(--ease),transform .7s var(--ease),filter .6s var(--ease)}
.photo-img.leave{opacity:.35;transform:scale(1.02);filter:blur(14px)}
.photo-img.enter{opacity:0;transform:scale(1.03);filter:blur(16px)}
.zoom{position:absolute;left:8px;top:8px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;z-index:2}
.skeleton{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%,rgba(255,255,255,.35),rgba(255,255,255,.75));backdrop-filter:blur(22px) saturate(.85);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.skeleton.show{opacity:1}
.skeleton::before{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);animation:sheen 1.6s ease-in-out infinite}
.sk-label{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;color:#525252;font-size:13px;font-weight:500}
.sk-label .pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.sk-label .line{width:160px;height:3px;border-radius:3px;background:rgba(0,0,0,.06);overflow:hidden}
.sk-label .line i{display:block;width:40%;height:100%;border-radius:3px;background:var(--primary);animation:slide 1.1s ease-in-out infinite}
@keyframes sheen{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
@keyframes shimmer{to{background-position:-200% 0}}

/* оверлей состояния */
.veil{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.veil.dark{background:rgba(23,23,23,.5)}
.veil.show{opacity:1;pointer-events:auto}
.card{width:420px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12);transform:translateY(10px) scale(.97);opacity:0;transition:transform .42s var(--ease),opacity .3s var(--ease)}
.veil.show .card{transform:none;opacity:1;transition-delay:.06s}
.tile{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.tile.blue{background:rgba(3,105,161,.1);color:var(--primary)}.tile.amber{background:rgba(217,119,6,.12);color:var(--warn)}.tile.grey{background:var(--muted-bg);color:var(--muted)}
.kicker{font-size:12px;color:var(--muted);font-weight:500}
.card h3{margin:0;font-size:20px;font-weight:600;line-height:26px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:20px}
.countdown{display:flex;gap:8px}
.countdown span{width:68px;padding:8px 0;display:flex;flex-direction:column;align-items:center;border:1px solid var(--border);border-radius:8px}
.countdown b{font-size:22px;line-height:26px;font-variant-numeric:tabular-nums}.countdown small{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .15s}
.btn:hover{background:var(--muted-bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-hover)}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats span{display:flex;flex-direction:column;padding:10px 4px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted)}
.stats b{font-size:20px;color:var(--fg);line-height:24px}
.progress{width:180px;height:4px;border-radius:4px;background:var(--border);overflow:hidden}
.progress i{display:block;width:40%;height:100%;background:var(--primary);border-radius:4px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* быстрые оповещения: выиграл / проиграл */
.toast{position:absolute;z-index:6;top:50%;left:50%;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:12px;color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.22);transform:translate(-50%,-50%) translateY(10px) scale(.94);opacity:0;pointer-events:none;transition:transform .45s var(--ease),opacity .3s var(--ease);white-space:nowrap}
.toast.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.toast.won{background:var(--ok)}.toast.lost{background:var(--err)}.toast.sold{background:#262626}
.tint{position:absolute;inset:0;z-index:5;opacity:0;pointer-events:none;backdrop-filter:blur(8px);transition:opacity .4s var(--ease)}
.tint.light{background:rgba(255,255,255,.4)}
.tint.won{background:rgba(22,163,74,.16)}.tint.lost{background:rgba(220,38,38,.14)}.tint.sold{background:rgba(23,23,23,.12)}
.tint.show{opacity:1}
.toast .ti{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.toast strong{display:block;font-size:15px;font-weight:600}.toast small{display:block;font-size:12px;opacity:.85}
.toast .bar{position:absolute;left:12px;right:12px;bottom:4px;height:2px;border-radius:2px;background:rgba(255,255,255,.35);transform-origin:left;transform:scaleX(0)}
.toast .ti svg{transform-origin:50% 60%}
.toast.won.show .ti svg{animation:cup .9s cubic-bezier(.3,1.4,.5,1) .15s both}
.toast.lost.show .ti svg,.toast.sold.show .ti svg{transform-origin:20% 80%;animation:knock .7s ease-out .15s both}
.toast.show .ti{animation:glow 1.2s ease-out .1s}
@keyframes cup{0%{transform:scale(.4) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(6deg);opacity:1}80%{transform:scale(.96) rotate(-3deg)}100%{transform:none}}
@keyframes knock{0%{transform:rotate(-35deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}100%{transform:none}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
@keyframes bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.ring{position:absolute;inset:0;z-index:4;border:3px solid transparent;border-radius:6px;pointer-events:none;transition:border-color .35s var(--ease)}
.ring.won{border-color:var(--ok)}.ring.lost{border-color:var(--err)}.ring.sold{border-color:#a3a3a3}.ring.lead{border-color:rgba(22,163,74,.55)}.ring.out{border-color:rgba(220,38,38,.6);animation:pulse 1s ease-in-out 2}
@keyframes pulse{50%{border-color:rgba(220,38,38,.15)}}

/* ---- лот: инфо и ставки ---- */
.lotline{position:absolute;left:280px;top:540px;width:891px;display:flex;align-items:baseline;gap:8px}
.lotline small{color:var(--muted);font-size:13px}
.lotno{font-size:24px;font-weight:600;display:inline-block;transition:opacity .25s,transform .35s var(--ease)}
.lotno.swap{opacity:0;transform:translateY(-8px)}
.notes{color:var(--primary);font-size:14px;font-weight:500;padding:2px 6px;border-radius:6px;background:rgba(3,105,161,.07)}
.desc{position:absolute;left:280px;top:584px;width:891px;height:80px;padding:8px 8px;border:1px solid var(--border);border-radius:8px;font-size:14px;line-height:20px;transition:opacity .3s}
.desc .muted{color:var(--muted)}.desc.swap{opacity:0}
.desc .more{position:absolute;right:8px;bottom:6px;font-size:12px;padding:2px 8px;border:1px solid var(--border);border-radius:6px}
.bidrow{position:absolute;left:280px;top:680px;width:891px;height:110px;display:grid;grid-template-columns:191px 1fr 191px 120px 100px;align-items:start;gap:24px;transition:opacity .3s,filter .3s}
.bidrow.locked{opacity:.45;filter:grayscale(.6);pointer-events:none}
.bidcol{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:#525252}
.bidbtn{width:191px;height:42px;margin-top:4px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border:0;border-radius:8px 8px 8px 8px;background:var(--primary);color:#fff;font-size:16px;font-weight:500;transition:transform .08s,background .2s}
.bidbtn:active{transform:scale(.98)}.bidbtn:hover{background:var(--primary-hover)}
.bidbtn.cut{background:linear-gradient(90deg,#2b85c2 0 48%,var(--primary) 48%)}
.bidbtn[disabled]{background:#94a3b8;cursor:not-allowed}
.bidcol .sub{margin-top:6px;font-size:12px}.bidcol .eur{font-size:15px;color:var(--fg);font-weight:500}
.current{display:flex;flex-direction:column;align-items:center}
.current small{font-size:12px;color:#525252}
.amount{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;transition:color .3s}
.amount.bump{animation:bump .45s var(--ease)}
@keyframes bump{30%{transform:scale(1.06);color:var(--primary)}}
.leader{margin-top:4px;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--muted-bg);transition:background .3s,color .3s}
.leader.me{background:var(--ok);color:#fff}
.timer{position:relative;width:100px;height:100px}
.timer svg{transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}
.timer .bgc{stroke:#f0f0f0}.timer .fgc{stroke:var(--primary);stroke-linecap:round;transition:stroke-dasharray 1s linear,stroke .3s}
.timer.hot .fgc{stroke:var(--err)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.hot b{color:var(--err)}
.block{height:36px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:500}

/* ---- правая колонка ---- */
.right{position:absolute;left:1187px;top:66px;width:243px}
.limit{text-align:right;color:var(--muted);font-size:16px;padding:8px 0}
.limit b{color:var(--fg);font-weight:500}
.msg{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:500;margin-top:8px}
.tabs{display:flex;justify-content:space-around;margin-top:10px;padding:4px;border:1px solid var(--border);border-radius:8px;font-size:12px}
.tabs span{padding:4px 10px;border-radius:6px}.tabs .on{background:rgba(3,105,161,.08);color:var(--primary)}
.feed{margin-top:10px;height:596px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:14px}
.feed .note{padding:8px;margin-bottom:8px;background:var(--gold-bg);font-weight:500;line-height:20px;border-radius:4px}
.feed .note em{color:var(--gold);font-style:normal}
.fi{display:flex;gap:6px;height:24px;align-items:center;overflow:hidden;animation:fin .4s var(--ease)}
.fi .w{color:#525252}.fi .me{color:var(--ok);font-weight:500}.fi .ot{color:var(--err);font-weight:500}
.fsep{text-align:center;color:var(--muted);font-size:13px;margin:8px 0;animation:fin .4s var(--ease)}
@keyframes fin{from{height:0;opacity:0;transform:translateY(-6px)}}

/* ---- нижняя лента лотов ---- */
.strip{position:absolute;left:264px;top:800px;width:1171px;height:224px;padding:0 10px}
.filters{display:flex;gap:6px;padding:6px 6px 8px}
.filters span{padding:2px 8px;border:1px solid;border-radius:6px;font-size:12px}
.strip-view{height:180px;overflow:hidden;background:#fffdf5;border-top:1px solid var(--border)}
.strip-track{display:flex;gap:8px;padding:10px;transition:transform .7s var(--ease)}
.strip-track .lcard{width:232px;flex-shrink:0;height:160px}
.strip-track .lcard img{height:104px}

/* ---- панель управления прототипом ---- */
.ctrl{position:fixed;z-index:50;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(15,23,42,.18);max-width:calc(100vw - 24px);overflow-x:auto}
.ctrl .lbl{padding:0 6px;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--muted-bg)}
.seg button{height:30px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.ctrl .sep{width:1px;height:28px;background:var(--border)}
.ctrl .btn{height:34px;white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:13px}
.ctrl .btn.green{color:var(--ok)}.ctrl .btn.dark{color:var(--fg)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* плашка состояния: на всё фото, компоновка по центру */
.veil{padding:0}
.veil .card{width:100%;height:100%;justify-content:center;gap:10px;padding:24px;border:1px solid #d4d4d4;border-radius:6px;background:#fff;box-shadow:none;transform:none}
.veil .card .ctext{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:460px}
.veil .card .cextra{margin-top:6px}
.veil .card .actions{margin-top:6px}
.veil .card .tile{width:56px;height:56px;border-radius:14px;position:relative;margin-bottom:4px}
.stats{display:flex;gap:8px}.stats span{min-width:96px;padding:8px 10px;text-align:center}
/* живые иконки */
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 currentColor;opacity:.35;animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{box-shadow:0 0 0 0 currentColor;opacity:.3}80%,100%{box-shadow:0 0 0 12px currentColor;opacity:0}}
.anim-cal svg{transform-origin:50% 55%;animation:tickTock 2s ease-in-out infinite}
@keyframes tickTock{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg)}20%{transform:rotate(8deg)}30%{transform:rotate(-4deg)}40%{transform:rotate(0)}}
.anim-pause svg{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.55}}
.anim-tech svg{animation:alert 2.6s ease-in-out infinite}
@keyframes alert{0%,60%,100%{transform:translateX(0)}66%{transform:translateX(-3px) rotate(-6deg)}72%{transform:translateX(3px) rotate(6deg)}78%{transform:translateX(-2px) rotate(-3deg)}84%{transform:translateX(0)}}
.anim-flag svg{transform-origin:20% 90%;animation:wave 1.8s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-6deg) scaleX(.94)}}
@media (prefers-reduced-motion: reduce){.tile::after{display:none}}

/* --- сверка с макетом 17907:333860 --- */
.title{font-size:16px;font-weight:400}
.catalog,.cur{font-size:14px;font-weight:500}
.ukflag{display:block;border-radius:2px}
.cur .ukflag{width:24px;height:16px}
.lotline small{font-size:12px;color:#737373}
.lotno{font-size:24px;font-weight:700}
.notes{background:#f0f9ff;border-radius:4px;font-size:14px;font-weight:500;padding:2px 6px}
.lotline .lsp{flex:1}.lotline .fs{color:#525252;font-size:16px}
.bidcol{align-items:flex-start;color:#737373;font-weight:500}
.bidcol>span:first-child{font-size:12px}
.bidbtn{height:44px;border-radius:10px;font-size:16px;font-weight:500;color:#fafafa}
.bidcol .sub{color:#737373;font-weight:500}.bidcol .eur{font-size:16px;font-weight:500;color:#0a0a0a}
.current small{font-size:12px;font-weight:500;color:#737373}
.amount{font-size:30px;font-weight:700;color:#0a0a0a}
.res{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:2px;font-size:12px;font-weight:500;color:#dc2626;transition:color .3s}
.res.ok{color:#059669}
.timer .bgc{stroke:#f5f5f5;stroke-width:8}.timer .fgc{stroke:#059669;stroke-width:8}
.timer b{font-size:36px;font-weight:700;color:#333}
.timer.hot .fgc{stroke:#dc2626}.timer.hot b{color:#dc2626}
.block{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;border-radius:8px}
.limit{display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:16px;color:#737373}
.limit b{font-weight:600;color:#737373}
.upbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid #0d9488;border-radius:8px;color:#0d9488}
.msg{font-size:14px;font-weight:500}.env{position:relative}.env i{position:absolute;top:-2px;right:-4px;width:7px;height:7px;border-radius:50%;background:#dc2626}
.tabs{font-size:12px;font-weight:500}.tabs .on{background:#e0f2fe;color:#0c4a6e;border-radius:8px}
.feed .note{background:#fffbeb;font-size:14px;font-weight:700}.feed .note em{color:#d97706}

/* Lot card: Last / Track / Main / Win / Lost / Proxy / Autobid */

/* ---- скрытие панелей лотов: анимация + адаптация раскладки ---- */
.screen{--mv:cubic-bezier(.77,0,.175,1);--out:cubic-bezier(.23,1,.32,1)}
.side,.strip{transition:transform 320ms var(--out),opacity 220ms ease,visibility 0s}

.side-open,.strip-open{display:flex;visibility:hidden;opacity:0;pointer-events:none;transition:opacity 180ms ease,visibility 0s 180ms,left 360ms var(--mv),top 360ms var(--mv)}

.amp-val button{position:absolute;right:4px;top:6px;width:24px;height:24px;border:0;background:transparent;color:#a3a3a3;cursor:pointer}
.amp-bid,.amp-won{flex:0 0 84px;height:36px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:inherit;font-size:14px;font-weight:500;cursor:pointer}

const Z={s:1,x:0,y:0,moved:false,drag:null};
function zImg(){return document.getElementById("img")}
function zApply(anim){const im=zImg();if(!im)return;im.style.transition=anim?"transform 180ms cubic-bezier(.23,1,.32,1)":"none";im.style.transformOrigin="0 0";im.style.transform=Z.s===1?"":`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  const ph=document.querySelector(".photo");if(ph)ph.classList.toggle("is-zoomed-in",Z.s>1)}
function zoomPhoto(on){const sc=document.getElementById("screen");if(!sc)return;
  if(on){const br=document.getElementById("bidrow");sc.style.setProperty("--zh",Math.max(300,br.offsetTop-16)+"px")}
  Z.s=1;Z.x=0;Z.y=0;zApply(true);setTimeout(()=>{const im=zImg();if(im&&Z.s===1)im.style.transition=""},200);setState("photo-zoom",on)}
function zClamp(w,h){Z.x=Math.min(0,Math.max(w-w*Z.s,Z.x));Z.y=Math.min(0,Math.max(h-h*Z.s,Z.y))}
document.addEventListener("wheel",e=>{const sc=document.getElementById("screen");if(!sc||!sc.classList.contains("photo-zoom"))return;const ph=e.target.closest&&e.target.closest(".photo");if(!ph)return;e.preventDefault();
  const k=sc.getBoundingClientRect().width/1440,r=ph.getBoundingClientRect();const cx=(e.clientX-r.left)/k,cy=(e.clientY-r.top)/k,w=r.width/k,h=r.height/k;
  const s2=Math.min(5,Math.max(1,Z.s*Math.pow(1.0015,-e.deltaY)));Z.x=cx-(cx-Z.x)*(s2/Z.s);Z.y=cy-(cy-Z.y)*(s2/Z.s);Z.s=s2;if(Z.s<=1.001){Z.s=1;Z.x=0;Z.y=0}zClamp(w,h);zApply(false)},{passive:false});
document.addEventListener("pointerdown",e=>{Z.moved=false;const sc=document.getElementById("screen");if(!sc||!sc.classList.contains("photo-zoom")||Z.s<=1)return;const ph=e.target.closest&&e.target.closest(".photo");if(!ph||e.target.closest(".zoom"))return;Z.drag={x:e.clientX,y:e.clientY,ox:Z.x,oy:Z.y};Z.moved=false;ph.classList.add("is-panning")});
document.addEventListener("pointermove",e=>{if(!Z.drag)return;const sc=document.getElementById("screen");const k=sc.getBoundingClientRect().width/1440;const dx=(e.clientX-Z.drag.x)/k,dy=(e.clientY-Z.drag.y)/k;if(Math.abs(dx)+Math.abs(dy)>3)Z.moved=true;Z.x=Z.drag.ox+dx;Z.y=Z.drag.oy+dy;const ph=document.querySelector(".photo");zClamp(ph.offsetWidth,ph.offsetHeight);zApply(false)});

let demoRun=0;
async function startDemo(){const run=++demoRun;const ok=()=>run===demoRun;const btn=$("demo");btn.textContent="■ Остановить";btn.onclick=()=>{demoRun++;btn.textContent="▶ Демо-сценарий";btn.onclick=startDemo};
  const steps=[async()=>{await setMode("soon");await wait(3200)},async()=>{await setMode("live");await wait(1800);bid(current+step(current),true);await wait(1600)},
    async()=>{bid(current+step(current),false);await wait(1500);bid(current+step(current),true);await wait(1200)},async()=>{leaderMe=true;myBid=true;setPrices();await hammer("won");await wait(1500)},
    async()=>{bid(current+step(current),true);await wait(1300);bid(current+step(current),false);await wait(1200);await hammer("lost");await wait(1200)},

/* Раздача лимитов — та же логика, что в ЛК аукциониста (Участники): принять запрос / отклонить / без лимита / блок / увеличить вручную */
const LIM_ICO={ok:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',no:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',inf:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 12c-2-2.7-4-4-6-4a4 4 0 0 0 0 8c2 0 4-1.3 6-4Zm0 0c2 2.7 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.3-6 4Z"/></svg>',lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/></svg>'};

const limSorted=()=>LIMITS.map((r,i)=>[r,i]).sort((a,b)=>(b[0].request?1:0)-(a[0].request?1:0)||a[0].at-b[0].at);
const remHTML=r=>r.adm==="ok"?`<b>${usd(r.limit-r.spent)}</b>/<i>${usd(r.limit)}</i>`:r.adm==="inf"?`<i>∞</i>`:`<em>—</em>`;
const admBtns=(r,i)=>`<span class="a-lim-act"><button type="button" class="ok" data-acc="${i}" title="${r.request?"Принять запрос":"Допустить с лимитом"}" aria-label="${r.request?"Принять запрос":"Допустить с лимитом"}">${LIM_ICO.ok}</button><button type="button" class="no ${r.adm==="no"?"on":""}" data-rej="${i}" title="${r.request?"Отклонить запрос":"Отклонить допуск"}" aria-label="${r.request?"Отклонить запрос":"Отклонить допуск"}">${LIM_ICO.no}</button><button type="button" class="inf ${r.adm==="inf"?"on":""}" data-inf="${i}" aria-pressed="${r.adm==="inf"}" title="Допустить без лимита" aria-label="Допустить без лимита">${LIM_ICO.inf}</button></span>`;

function limitsTable(){return `<table><thead><tr><th>ID</th><th>Name</th><th>Country</th><th>Request</th><th>Admission</th><th>Set limit manually</th><th>Lock</th><th>Remains/Limit</th><th>Paid</th><th>Unpaid</th></tr></thead><tbody>${limSorted().map(([r,i])=>`<tr class="${r.request?"has-req":""} ${r.locked?"is-locked":""}"><td>${r.id}</td><td>${r.name}</td><td>${r.country}</td><td class="req">${r.request?usd(r.request):""}</td><td>${admBtns(r,i)}</td><td>${incForm(i)}</td><td><button type="button" class="a-lock ${r.locked?"on":""}" data-lock="${i}" aria-pressed="${r.locked}" title="${r.locked?"Разблокировать участника":"Заблокировать участника"}" aria-label="${r.locked?"Разблокировать участника":"Заблокировать участника"}">${LIM_ICO.lock}</button></td><td class="rem">${remHTML(r)}</td><td>${usd(r.paid)}</td><td class="unp">${usd(r.unpaid)}</td></tr>`).join("")}</tbody></table>`}
function limitCards(){return limSorted().map(([r,i])=>`<div class="am-req ${r.locked?"is-locked":""}"><header class="${r.request?"is-req":""}">${r.request?`<span>Request</span><span>${usd(r.request)}</span>`:`<span>ID ${r.id}</span><span>${r.locked?"Blocked":""}</span>`}</header><dl><dt>Name</dt><dd>${r.name}</dd><dt>Country</dt><dd>${r.country}</dd><dt>Paid</dt><dd class="ok">${usd(r.paid)}</dd><dt>Unpaid</dt><dd class="no">${usd(r.unpaid)}</dd><dt>Limit/Remains</dt><dd class="rem">${remHTML(r)}</dd></dl>${incForm(i)}<div class="acts"><button type="button" class="no ${r.locked?"on":""}" data-lock="${i}" aria-pressed="${r.locked}">${r.locked?"Unblock":"Block"}</button><button type="button" class="no ${r.adm==="no"?"on":""}" data-rej="${i}">Reject</button><button type="button" class="inf ${r.adm==="inf"?"on":""}" data-inf="${i}" aria-pressed="${r.adm==="inf"}">Auto</button><button type="button" class="ok" data-acc="${i}">Accept</button></div></div>`).join("")}
function limAct(k,i,v){const r=LIMITS[i];let m;
  if(k==="acc"){if(r.request){r.limit=r.request>r.limit?r.request:r.limit+r.request;r.adm="ok";m=`Запрос ${r.name} принят: лимит ${usd(r.limit)}`;r.request=0}else if(r.adm==="ok"){m=`${r.name} уже допущен с лимитом ${usd(r.limit)}`}else{r.limit=r.limit||30000;r.adm="ok";m=`${r.name} допущен с лимитом ${usd(r.limit)}`}}
  else if(k==="rej"){if(r.request){m=`Запрос ${r.name} на ${usd(r.request)} отклонён`;r.request=0}else if(r.adm==="no"){r.adm=null;m=`Решение по ${r.name} сброшено`}else{r.adm="no";r.limit=0;r.spent=0;m=`${r.name}: допуск отклонён`}}
  else if(k==="inf"){if(r.adm==="inf"){r.adm="ok";r.limit=r.limit||30000;m=`${r.name}: безлимит снят`}else{r.adm="inf";r.request=0;m=`${r.name} допущен без лимита`}}

  else if(k==="inc"){if(!v){snack("Введите сумму, на которую увеличить лимит");return}r.limit=(r.adm==="ok"?r.limit:r.spent)+v;r.adm="ok";m=`Лимит ${r.name}: ${usd(r.limit)}`}

function syncBlock(){const sc=document.getElementById("screen");if(sc)sc.classList.toggle("is-blocked",BLOCKED);
  document.querySelectorAll("#screen .block").forEach(b=>{b.innerHTML=BLOCKED?`Unblock ${UNLOCK}`:`Block ${LOCK}`;b.setAttribute("aria-pressed",String(BLOCKED));b.title=BLOCKED?"Разблокировать ставки":"Заблокировать ставки"});
  const m=document.querySelector(".m-row2 .m-sq.dark");if(m){m.setAttribute("role","button");m.tabIndex=0;m.classList.add("m-lock");m.setAttribute("aria-pressed",String(BLOCKED));m.setAttribute("aria-label",BLOCKED?"Разблокировать ставки":"Заблокировать ставки");m.innerHTML=BLOCKED?LOCK:UNLOCK}}
function toggleBlock(){BLOCKED=!BLOCKED;syncBlock();snack(BLOCKED?"Ставки заблокированы":"Ставки разблокированы")}
document.addEventListener("click",e=>{if(e.target.closest("#screen .block,#screen .m-lock"))toggleBlock()});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest(".m-lock")){e.preventDefault();toggleBlock()}});

/* ================= типы торгов ================= */
const ICO={img:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>',
 chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
 check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
 stand:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="3"/><path d="M6.5 13h11l1.5 8h-14z"/><path d="M12 8v5"/></svg>',
 ban:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>',
 x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
 grip:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20"/><path d="m15 19-3 3-3-3M19 9l3 3-3 3M9 5l3-3 3 3M5 15l-3-3 3-3"/></svg>',
 ok:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>'};
function metalsHTML(){return `<div class="mt-prices" id="mtPrices" aria-label="Цены металлов за унцию">${METALS.map(([k,v])=>`<span class="mt-${k.toLowerCase()}"><em>${k}</em><b>${v}</b></span>`).join("")}</div>`}
function typeLot(){document.querySelectorAll(".mt-badge").forEach(b=>{const m=lots[lotIdx].metal;b.textContent=m;b.className="mt-badge mt-"+m.toLowerCase()})}
function videoHTML(){return `<div class="rv" role="img" aria-label="Видеотрансляция из зала">${ICO.img}<span class="rv-live"><i></i>LIVE · Room</span></div>`}

/* Fixed time: ставка выбирается из списка сумм (без CUT BID) */
let FX=null;
function fxOpts(){const s=step(current);return [1,2,3,4,5].map(k=>current+s*k)}
function fxHTML(){return `<div class="fx" id="fx"><div class="fx-top"><div class="fx-chips" id="fxChips"></div><span>Your Bid in USD</span></div><div class="fx-box"><button type="button" class="fx-inp" id="fxInp" aria-haspopup="listbox" aria-expanded="false"><span id="fxVal"></span>${ICO.chev}</button><button type="button" class="fx-bid" id="fxBid">BID</button><div class="fx-list" id="fxList" role="listbox" aria-label="Сумма ставки" hidden></div></div><span class="sub" id="fxSub"></span><span class="eur" id="fxEur"></span></div>`}
function fxRender(){if(!document.getElementById("fx"))return;const o=fxOpts();if(!FX||FX<=current)FX=o[0];
  $("fxChips").innerHTML=o.slice(1,4).map(v=>`<button type="button" data-fx="${v}" class="${v===FX?"on":""}">${fmt(v)}</button>`).join("");
  $("fxVal").textContent=fmt(FX);$("fxSub").textContent=`${fmt(FX*1.18)} USD (W/BP 18%)`;$("fxEur").textContent=`${fmt(FX*CUR.rate)} ${CUR.code}`;
  $("fxList").innerHTML=o.map(v=>`<button type="button" role="option" aria-selected="${v===FX}" data-fx="${v}">${fmt(v)}${v===FX?ICO.check:""}</button>`).join("");
  $("fxBid").disabled=leaderMe&&ROLE!=="a"}
function fxOpen(on){const l=document.getElementById("fxList");if(!l)return;l.hidden=!on;$("fxInp").setAttribute("aria-expanded",String(on))}
document.addEventListener("click",e=>{const t=e.target;
  const o=t.closest("[data-fx]");if(o){FX=+o.dataset.fx;fxOpen(false);fxRender();return}
  if(t.closest("#fxInp")){fxOpen(document.getElementById("fxList").hidden);return}
  if(t.closest("#fxBid")){if(mode==="live"&&!busy){const A=ROLE==="a";bid(FX,!A,A?"Room":undefined);FX=null;fxRender()}return}
  if(!t.closest("#fx"))fxOpen(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")fxOpen(false)});

/* Зал: пульт аукциониста — ставки из зала с клавиатуры, таблица CUTBID/BID, продажа участнику в зале */
let AM_ON=true,AMV="",AMF=null;/* AMF — позиция откреплённого пульта {x,y} в окне браузера: его можно увести за пределы экрана торгов */
function amRows(){const s=step(current);return Array.from({length:8},(_,k)=>`<div><button type="button" data-rb="${current+s*k+s/2}">${fmt(current+s*k+s/2)}</button><button type="button" data-rb="${current+s*(k+1)}">${fmt(current+s*(k+1))}</button></div>`).join("")}
function amHTML(){return `<section class="amp" id="amPanel" aria-label="Auction management"><header><b>Auction management</b><button type="button" class="amp-grip" id="ampGrip" aria-label="Открепить и перетащить пульт" title="Потяните, чтобы открепить и переместить. Нажмите — вернуть на место">${ICO.grip}</button><button type="button" class="amp-x" id="ampHide" aria-label="Скрыть пульт">✕</button></header>
  <div class="amp-in"><label class="amp-val"><input id="ampVal" inputmode="numeric" placeholder="000" aria-label="Ставка из зала" autocomplete="off"><button type="button" id="ampClr" aria-label="Очистить">✕</button></label><button type="button" class="amp-bid" id="ampBid" disabled>Bid</button></div>
  <div class="amp-keys">${["Delete","←",".","7","8","9","4","5","6","1","2","3",".000",".00","0"].map(k=>`<button type="button" data-k="${k}" class="${k==="Delete"?"is-del":""}">${k}</button>`).join("")}</div>
  <div class="amp-tbl"><div class="amp-th"><span>CUTBID</span><span>BID</span></div><div class="amp-rows" id="ampRows">${amRows()}</div></div>
  <div class="amp-in"><input id="ampPart" inputmode="numeric" placeholder="Participant №" aria-label="Номер участника в зале" autocomplete="off"><button type="button" class="amp-won" id="ampWon" disabled>Lot ${lots[lotIdx].no} won</button></div>
  <button type="button" class="amp-close" id="ampClose">Close lot ${ICO.ok}</button></section>`}
function amSync(){const v=document.getElementById("ampVal");if(!v)return;v.value=AMV?fmt(+AMV):"";$("ampBid").disabled=!(+AMV>current);$("ampWon").disabled=!$("ampPart").value.trim()}
function amRefresh(){const r=document.getElementById("ampRows");if(!r)return;r.innerHTML=amRows();$("ampWon").textContent=`Lot ${lots[lotIdx].no} won`;amSync()}
function amPlace(){const sc=document.getElementById("screen"),p=document.getElementById("amPanel");
  /* закреплённый пульт сужает фото и описание; закрыт или откреплён — блоки занимают всё место */
  if(sc)sc.classList.toggle("room-am",!!p&&AM_ON&&!AMF);if(!p)return;
  const k=sc?sc.getBoundingClientRect().width/1440:1;
  if(AMF){if(p.parentElement!==document.body)document.body.appendChild(p);p.classList.add("is-float");
    const w=p.offsetWidth*k,h=p.offsetHeight*k;AMF.x=Math.min(innerWidth-w-4,Math.max(4,AMF.x));AMF.y=Math.min(innerHeight-h-4,Math.max(4,AMF.y));
    Object.assign(p.style,{position:"fixed",left:AMF.x+"px",top:AMF.y+"px",right:"auto",transform:`scale(${k})`,transformOrigin:"0 0"})}
  else{if(sc&&p.parentElement!==sc)sc.appendChild(p);p.classList.remove("is-float");p.style.cssText=""}
  const g=document.getElementById("ampGrip");if(g)g.setAttribute("aria-pressed",String(!!AMF))}
addEventListener("resize",()=>setTimeout(amPlace,60));
function amToggle(on){AM_ON=on;const sc=document.getElementById("screen");const p=document.getElementById("amPanel");if(on&&!p){sc.insertAdjacentHTML("beforeend",amHTML());amSync()}if(!on&&p)p.remove();amPlace();const b=document.getElementById("aRoom");if(b){b.classList.toggle("on",on);b.setAttribute("aria-pressed",String(on))}}
function roomBid(v){if(mode!=="live"||busy)return;if(!(v>current)){snack(`Ставка из зала должна быть больше ${fa(current)}`);return}bid(v,false,"Room");AMV="";amSync()}
document.addEventListener("click",e=>{const t=e.target;if(!t.closest("#amPanel,#aRoom,.a-cancels,.a-go"))return;
  if(t.closest("#aRoom")){amToggle(!AM_ON);return}
  if(t.closest("#ampHide")){amToggle(false);return}
  const k=t.closest("[data-k]");if(k){const c=k.dataset.k;AMV=c==="Delete"?"":c==="←"?AMV.slice(0,-1):c==="."?AMV:(AMV+c.replace(".","")).replace(/^0+(?=\d)/,"").slice(0,10);amSync();return}
  if(t.closest("#ampClr")){AMV="";amSync();return}
  if(t.closest("#ampBid")){roomBid(+AMV);return}
  const r=t.closest("[data-rb]");if(r){roomBid(+r.dataset.rb);return}
  if(t.closest("#ampWon")){const n=$("ampPart").value.trim();if(!n||busy||mode!=="live")return;TOPBID=[current,`Room №${n}`];leaderMe=false;myBid=false;$("ampPart").value="";hammer();return}
  if(t.closest("#ampClose")){if(!busy&&mode==="live")hammer();return}
  if(t.closest("#aCancelLast")){if(busy||!BIDS.length)return;const [c,lm,tb]=BIDS.pop();current=c;leaderMe=lm;TOPBID=tb;animateAmount(current);setPrices();updTop();feed("Last bid cancelled","fsep");return}
  if(t.closest("#aCancelAll")){if(busy)return;const l=lots[lotIdx];BIDS.length=0;current=l.start;leaderMe=false;myBid=false;animateAmount(current);setPrices();feed(`All bids on lot ${l.no} cancelled`,"fsep");return}
  if(t.closest("#aGo")){const n=+$("aGoNo").value;const i=lots.findIndex(l=>l.no===n);if(i<0){snack(`Лота №${n||"—"} нет в аукционе`);return}if(i<=lotIdx){snack("Можно перейти только к следующим лотам");return}
    if(busy)return;(async()=>{if(mode!=="live")await setMode("live");busy=true;stopClock();$("bidrow").classList.add("locked");lots[lotIdx].sold=true;lots[lotIdx].price=current;lotIdx=i-1;positionStrips();await nextLot();busy=false;$("bidrow").classList.remove("locked");startClock();$("aGoNo").value=""})();return}});
/* перетаскивание пульта за иконку: потянуть — открепить и переместить, нажать без движения — вернуть на место */
let AMD=null;
document.addEventListener("pointerdown",e=>{const g=e.target.closest&&e.target.closest("#ampGrip");if(!g)return;e.preventDefault();const p=document.getElementById("amPanel"),pr=p.getBoundingClientRect();
  AMD={sx:e.clientX,sy:e.clientY,x0:pr.left,y0:pr.top,moved:false};g.setPointerCapture&&g.setPointerCapture(e.pointerId);p.classList.add("is-drag")});
document.addEventListener("pointermove",e=>{if(!AMD)return;const dx=e.clientX-AMD.sx,dy=e.clientY-AMD.sy;if(!AMD.moved&&Math.abs(dx)+Math.abs(dy)<4)return;AMD.moved=true;AMF={x:AMD.x0+dx,y:AMD.y0+dy};amPlace()});
document.addEventListener("pointerup",()=>{if(!AMD)return;const p=document.getElementById("amPanel");if(p)p.classList.remove("is-drag");if(!AMD.moved&&AMF){AMF=null;amPlace()}AMD=null});
document.addEventListener("keydown",e=>{if(e.target.id==="ampGrip"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();if(AMF)AMF=null;else{const r=document.getElementById("amPanel").getBoundingClientRect();AMF={x:r.left-40,y:r.top+40}}amPlace();const g=document.getElementById("ampGrip");g&&g.focus()}});
document.addEventListener("input",e=>{if(e.target.id==="ampVal"){AMV=e.target.value.replace(/\D/g,"").slice(0,10);amSync()}if(e.target.id==="ampPart")amSync()});
document.addEventListener("keydown",e=>{if(e.target.id==="ampVal"&&e.key==="Enter"){e.preventDefault();roomBid(+AMV)}});

function applyType(){const sc=document.getElementById("screen");if(!sc)return;if(!(TYPE==="room"&&ROLE==="a"&&VIEW==="d")){const ap=document.getElementById("amPanel");if(ap)ap.remove()}["room","fix","metal"].forEach(t=>sc.classList.toggle("t-"+t,TYPE===t));
  document.querySelectorAll("#types button").forEach(b=>b.classList.toggle("on",b.dataset.t===TYPE));
  const A=ROLE==="a",D=VIEW==="d",M=TYPE==="metal";
  /* подписи «Your Bid in …» */
  const bc=document.getElementById("bidBtn");if(bc){if(D){const lb=bc.closest(".bidcol");if(lb)lb.firstElementChild.textContent=M?"Your Bid in %":"Your Bid in USD"}else{const lb=bc.previousElementSibling;if(lb)lb.textContent=M?"Your Bid in %":"Your Bid in USD";const cl=bc.querySelector(".cur-l");if(cl)cl.textContent=M?"":"USD"}}
  /* без CUT BID: Fixed time и слитки */
  if(!D&&(TYPE==="fix"||M)){const cb=document.getElementById("cutBtn");if(cb){[cb.previousElementSibling,cb,cb.nextElementSibling].forEach(x=>x&&(x.style.display="none"))}}
  /* слитки: цены металлов + металл лота */
  if(M){if(D)(A?document.querySelector(".right .a-top"):document.querySelector(".right .limit")).insertAdjacentHTML("afterend",metalsHTML());else document.querySelector(".m-row2").insertAdjacentHTML("afterend",metalsHTML());
    document.getElementById("lotno").insertAdjacentHTML("afterend",'<span class="mt-badge"></span>');typeLot()}
  /* Fixed time: выбор суммы из списка */
  if(TYPE==="fix"&&D){document.querySelector("#bidrow .current").insertAdjacentHTML("afterend",fxHTML());fxRender()}
  /* Зал: трансляция у участника, пульт зала у аукциониста */
  if(TYPE==="room"){if(!A){if(D)document.getElementById("feed").insertAdjacentHTML("beforebegin",videoHTML());else document.getElementById("bidrow").insertAdjacentHTML("afterend",videoHTML())}
    else if(D){document.querySelector(".right .a-top").insertAdjacentHTML("afterbegin",`<button type="button" class="a-ico" id="aRoom" aria-label="Пульт зала" title="Auction management" aria-pressed="false">${ICO.stand}</button>`);
      const c=document.getElementById("aCancel");if(c)c.outerHTML=`<div class="a-cancels"><button type="button" id="aCancelLast">Cancel last bid ${ICO.ban}</button><button type="button" id="aCancelAll">Cancel all bids ${ICO.x}</button></div><div class="a-go"><input id="aGoNo" inputmode="numeric" placeholder="№" aria-label="Номер лота"><button type="button" id="aGo">Go to lot</button></div>`;
      amToggle(AM_ON)}}
}
document.querySelectorAll("#types button").forEach(b=>b.onclick=()=>{if(b.dataset.t===TYPE||busy)return;TYPE=b.dataset.t;try{localStorage.setItem("lb-live-type",TYPE)}catch(e){}seedFeed();mount(VIEW);if(mode==="live")startClock()});
/* панель справа */
$("ctrlToggle").onclick=()=>{AUTO_CTRL=false;const m=document.body.classList.toggle("ctrl-min");$("ctrlToggle").textContent=m?"‹ Панель":"Скрыть панель ›";$("ctrlToggle").setAttribute("aria-expanded",!m);fit()};
document.querySelectorAll("#roles button").forEach(b=>b.onclick=()=>{if(b.dataset.r===ROLE)return;ROLE=b.dataset.r;mount(VIEW);try{parent!==window&&parent.postMessage({lb:"role",role:ROLE==="a"?"auctioneer":"participant"},"*")}catch(e){}});
if(window.top!==window){const x=$("exitBtn");x.hidden=false;x.onclick=e=>{e.preventDefault();parent.postMessage({lb:"exit"},"*")}}

/* ---------- два вида: десктоп и мобилка, одно состояние торгов ---------- */
/* Адаптация под ширину окна: телефон — нативный полноэкранный вид; узкое окно — мобильная раскладка; средняя ширина — колонка лотов сворачивается */
let AUTO_M=false,AUTO_SIDE=false,AUTO_CTRL=false;
function ctrlLabel(){const t=document.getElementById("ctrlToggle");if(!t)return;const m=document.body.classList.contains("ctrl-min");t.textContent=m?"‹ Панель":"Скрыть панель ›";t.setAttribute("aria-expanded",String(!m))}
function adapt(){const w=innerWidth;const native=w<600;document.body.classList.toggle("native",native&&VIEW==="m");if(native&&!document.body.classList.contains("ctrl-min")){document.body.classList.add("ctrl-min");AUTO_CTRL=true}if(!native&&AUTO_CTRL){document.body.classList.remove("ctrl-min");AUTO_CTRL=false}ctrlLabel();
  if(VIEW==="d"&&w<768){AUTO_M=true;mount("m");return true}
  if(VIEW==="m"&&AUTO_M&&w>=768){AUTO_M=false;mount("d");return true}
  const sc=document.getElementById("screen");if(VIEW==="d"&&sc){if(w<1200&&!sc.classList.contains("side-hidden")){sc.classList.add("side-hidden");AUTO_SIDE=true}else if(w>=1200&&AUTO_SIDE){sc.classList.remove("side-hidden");AUTO_SIDE=false}}
  return false}
function fit(){const cw=VIEW==="d"?212:56;/* на десктопе место под панель прототипа зарезервировано всегда — открытая панель ничего не перекрывает и не двигает экран *//* панель режимов лежит поверх и не меняет масштаб экрана торгов */const W=innerWidth-cw-24,H=innerHeight-24;const sc=$("screen");if(VIEW==="m"&&document.body.classList.contains("native")){sc.style.transform="none";return}if(VIEW==="m"){const k=Math.min(1,H/sc.offsetHeight,W/sc.offsetWidth);sc.style.transform=`translate(-50%,-50%) scale(${k})`;return}const s=Math.min(W/1440,H/1024);sc.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",()=>{if(!adapt())fit()});
function mount(v){
  VIEW=v;document.body.classList.toggle("m",v==="m");
  document.querySelectorAll("#views button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("app").innerHTML=document.getElementById(v==="m"?"tplM":"tplD").innerHTML;
  document.querySelectorAll("#roles button").forEach(b=>b.classList.toggle("on",b.dataset.r===ROLE));
  if(ROLE==="a")decorA(v);else{const n=document.querySelector(".feed .note");if(n)n.innerHTML=`<em>Auctioner:</em> ${NOTE}`}
  const l=lots[lotIdx];renderStrips();syncFollow();$("img").src=IMGS[l.img];$("lotno").textContent=l.no;$("amount").dataset.v=current;$("amount").textContent=fa(current);
  setDesc();setPrices();tick();renderFeed();bindScreen();mobileBidButtons();mountExtras();setCur(CUR.code);setLang(LANG);noteDot();applyType();setPrices();syncBlock();
  if(busy)$("bidrow").classList.add("locked");
  if(mode!=="live"){$("bidrow").classList.add("locked");showCard(mode)}
  document.body.classList.toggle("native",v==="m"&&innerWidth<600);if(v==="m"&&innerWidth<600&&!document.body.classList.contains("ctrl-min")){document.body.classList.add("ctrl-min");AUTO_CTRL=true}setTimeout(ctrlLabel,0);if(v==="d")AUTO_SIDE=false;fit();setTimeout(()=>{if(v==="d")adapt()},0);try{history.replaceState(null,"",(v==="m"?"#mobile":"#desktop")+(ROLE==="a"?"-auctioneer":""))}catch(e){}
}
document.querySelectorAll("#views button").forEach(b=>b.onclick=()=>{AUTO_M=false;b.dataset.v!==VIEW&&mount(b.dataset.v)});
function seedFeed(){const l=lots[lotIdx];FEED.length=0;BIDS.length=0;leaderMe=false;myBid=false;FX=null;current=l.start;const s=step(current),R=TYPE==="room";
  [["Internet",current-2*s,"AUTO Ivan Sergeev"],[R?"Room":"Internet",current-s,R?"Room":'<span class="g">Ivan Ivanov</span>']].forEach(([w,a,n])=>FEED.unshift([`<span class="w">${w==="Room"?"Room BID":w}:</span><span class="ot">${fa(a)}</span>`,"fi",`${fa(a)} — ${n}`]));TOPBID=[current-s,R?"Room":'<span class="g">Ivan Ivanov</span>'];FEED.unshift([`Lot ${l.no} open`,"fsep"])}
seedFeed();
mount(location.hash.startsWith("#mobile")||(!location.hash.startsWith("#desktop")&&innerWidth<600)?"m":"d");startClock();
</script>
</body>
</html>
